<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки — Smart Dashboard</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="settings">
    <header class="settings-header">
      <a class="back" id="back" href="popup.html">К панели</a>
      <div>
        <h1>Настройки</h1>
        <p id="version"></p>
      </div>
    </header>

    <section class="card">
      <h2>Тема</h2>
      <div class="segment" role="radiogroup" aria-label="Тема оформления">
        <button type="button" data-theme-choice="dark" role="radio">Тёмная</button>
        <button type="button" data-theme-choice="light" role="radio">Светлая</button>
      </div>
    </section>

    <section class="card">
      <h2>Погода</h2>
      <label>
        Обновление
        <select id="weather-interval">
          <option value="15">Каждые 15 минут</option>
          <option value="30">Каждые 30 минут</option>
          <option value="60">Каждый час</option>
          <option value="120">Каждые 2 часа</option>
        </select>
      </label>
      <label>
        Температура
        <select id="temperature-unit">
          <option value="celsius">Градусы Цельсия</option>
          <option value="fahrenheit">Градусы Фаренгейта</option>
        </select>
      </label>
      <label>
        Ветер
        <select id="wind-unit">
          <option value="kmh">Километры в час</option>
          <option value="ms">Метры в секунду</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>Валюты</h2>
      <label>
        Обновление курсов
        <select id="currency-interval">
          <option value="60">Каждый час</option>
          <option value="180">Каждые 3 часа</option>
          <option value="360">Каждые 6 часов</option>
          <option value="720">Каждые 12 часов</option>
          <option value="1440">Раз в сутки</option>
        </select>
      </label>
      <div class="add-row">
        <label>
          Избранные
          <select id="add-currency"></select>
        </label>
        <button class="primary" id="add-favorite" type="button">Добавить</button>
      </div>
      <ul class="favorite-list" id="favorite-list"></ul>
      <p class="hint">Не больше восьми валют. Они показываются под конвертером.</p>
    </section>

    <section class="card">
      <h2>Данные</h2>
      <div class="actions">
        <button type="button" id="clear-history">Очистить историю калькулятора</button>
        <button type="button" id="clear-weather">Сбросить кэш погоды</button>
        <button type="button" id="clear-rates">Сбросить кэш курсов</button>
      </div>
    </section>

    <p class="note" id="note"></p>
    <p class="toast hidden" id="toast" role="status"></p>
  </main>
  <script type="module" src="settings.js"></script>
</body>
</html>
